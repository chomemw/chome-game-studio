<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6427a5">
<title>Fruit Fancy | CHOME Game Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Fredoka,cursive,sans-serif;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.font-nunito{font-family:Nunito,sans-serif}.game-board{box-shadow:0 15px 35px #0004,inset 0 0 15px #ffffff66;background:linear-gradient(135deg,#ffffff40,#ffffff0d);backdrop-filter:blur(12px)}
#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:clamp(4px,1.4vw,8px);width:100%;height:100%}
#timeText{font-variant-numeric:tabular-nums}#timeText.urgent{color:#fecaca;animation:timerPulse .7s infinite alternate}@keyframes timerPulse{to{opacity:.55}}
.tile{position:relative;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#ffffff1c;border:1px solid #ffffff38;box-shadow:inset 0 1px 5px #fff2;min-width:0;min-height:0;font-size:clamp(23px,7vw,42px);cursor:pointer;transition:transform .13s;touch-action:none}
.tile.selected{transform:scale(1.13);filter:drop-shadow(0 0 10px #ffeb3b);z-index:3}
.tile .fruit-icon{pointer-events:none;filter:drop-shadow(0 3px 2px #0005)}
.ice-layer{position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,#c8f0ffbf,#78c8ffd9);border:2px solid #ffffffcc;display:grid;place-items:center;font-size:20px;pointer-events:none}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#lineCanvas{z-index:4}#fxCanvas{z-index:6}#comboContainer{position:absolute;inset:0;pointer-events:none;z-index:8}
.floating-score{position:absolute;z-index:9;pointer-events:none;font-weight:900;color:#fff36b;font-size:23px;text-shadow:2px 2px #000,-1px -1px #000;animation:floatUp .8s forwards}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(.8)}50%{opacity:1;transform:translate(-50%,-35px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60px)}}
.combo-popup{position:absolute;top:45%;left:50%;width:100%;text-align:center;animation:comboPop 1.1s forwards}
@keyframes comboPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-60%) scale(.8)}}
#modalOverlay{display:none}#modalOverlay.show{display:flex}
button{touch-action:manipulation}
@media(max-height:700px){header{gap:5px!important}main{max-height:min(62vh,500px)}footer{font-size:10px!important}}
</style>
</head>
<body class="bg-gradient-to-br from-pink-500 via-purple-600 to-indigo-700 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 text-white overflow-hidden">
<header class="w-full max-w-md flex flex-col items-center gap-2 mt-1 z-10">
<div class="w-full flex justify-between items-center px-2">
<div class="flex items-center gap-2"><span class="text-3xl sm:text-4xl">🍓</span><h1 class="text-2xl sm:text-3xl font-bold tracking-wider text-yellow-300 drop-shadow">FRUIT FANCY</h1></div>
<div class="flex gap-2"><button id="soundBtn" aria-label="Toggle sound" class="bg-white/20 p-2.5 rounded-full w-10 h-10 border border-white/30"><i class="fas fa-volume-up"></i></button><button id="refreshBtn" aria-label="Refresh fruits" title="Refresh fruits without restarting the level" class="bg-white/20 p-2.5 rounded-full w-10 h-10 border border-white/30"><i class="fas fa-sync-alt"></i></button></div>
</div>
<div class="w-full grid grid-cols-4 gap-1.5 bg-black/25 backdrop-blur-md p-2.5 rounded-2xl border border-white/20 shadow-lg text-center">
<div><span class="block text-[10px] uppercase text-pink-200">Level</span><b id="levelText" class="text-xl sm:text-2xl">1</b></div>
<div class="border-x border-white/10"><span class="block text-[10px] uppercase text-yellow-200">Run score</span><b id="scoreText" class="text-xl sm:text-2xl text-yellow-300">0</b><span class="text-[10px]"> / </span><span id="targetText" class="text-xs">400</span></div>
<div class="border-r border-white/10"><span class="block text-[10px] uppercase text-cyan-200">Moves</span><b id="movesText" class="text-xl sm:text-2xl text-cyan-300">18</b></div>

</div>
<div class="w-full bg-black/30 rounded-full h-3 border border-white/20 p-0.5 overflow-hidden"><div id="progressBar" class="bg-gradient-to-r from-yellow-400 to-green-400 h-full rounded-full w-0 transition-all"></div></div>

<div id="leaderboardStatus" class="w-full text-center text-xs text-white/80 pb-1" aria-live="polite"><span id="leaderboardMessage">Sign in and pass a level to join the rankings.</span> · <a href="leaderboards.html" class="underline text-yellow-200 font-bold">View leaderboard</a></div>
</header>
<main class="relative w-full max-w-md aspect-square my-auto flex items-center justify-center">

<div id="grid"></div><canvas id="lineCanvas"></canvas><canvas id="fxCanvas"></canvas><div id="comboContainer"></div>
</div>
</main>
<footer class="w-full max-w-md text-center py-1 text-xs text-white/80 font-medium z-10 flex justify-between items-center px-2"><span><i class="fas fa-hand-pointer mr-1"></i> Drag to connect 3+ matching fruits</span><span class="bg-yellow-400/20 px-2 py-1 rounded-md border border-yellow-300/30 text-yellow-200">💥 7+ = BLENDER BLAST!</span></footer>
<div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm items-center justify-center z-50 p-4">
<div class="bg-gradient-to-b from-purple-800 to-indigo-900 border-2 border-yellow-400/50 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl flex flex-col items-center">
<div id="modalIcon" class="text-6xl mb-2">🏆</div><h2 id="modalTitle" class="text-3xl font-black text-yellow-300 mb-1">LEVEL PASSED!</h2><p id="modalDesc" class="text-sm text-purple-200 mb-4 font-nunito">Juicy work!</p>
<div class="bg-black/30 rounded-xl p-3 w-full mb-5 space-y-1"><div class="flex justify-between text-sm"><span>Final Score:</span><b id="modalFinalScore" class="text-yellow-300">0</b></div><div class="flex justify-between text-sm"><span>Moves Remaining:</span><b id="modalMovesLeft" class="text-cyan-300">0</b></div></div>
<button id="modalActionBtn" class="w-full bg-gradient-to-r from-yellow-400 to-amber-500 text-purple-950 font-black py-3 rounded-2xl text-lg uppercase">Next Level</button>
</div></div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const supabase = createClient("https://zbumbbzvrjqjgroxzixg.supabase.co", "sb_publishable_dCXdE2oXUIl_UCbvhJcJ4Q_vDIY5eCK");
const N=6,FRUITS=[['apple','🍎','#ff4d4d'],['banana','🍌','#ffeb3b'],['grape','🍇','#ab47bc'],['orange','🍊','#ffa726'],['strawberry','🍓','#e91e63'],['watermelon','🍉','#66bb6a'],['cherry','🍒','#d81b60']].map(([type,emoji,color])=>({type,emoji,color}));
const LEVELS=[{target:400,moves:18,ice:0,bombs:0},{target:700,moves:20,ice:3,bombs:0},{target:1100,moves:22,ice:4,bombs:2},{target:1600,moves:20,ice:6,bombs:3},{target:2200,moves:24,ice:8,bombs:4}];
let level=0,score=0,target=400,moves=18,board=[],path=[],dragging=false,busy=false,sound=true,audio=null,particles=[],boardScanTimer=null;
let currentPlayer=null,saveChain=Promise.resolve(),initialized=false,scoreSubmittedForRun=false;
const LEVEL_DURATION=120;let timeLeft=LEVEL_DURATION,levelDeadline=0,timerId=null;
function setCloudStatus(text){const el=document.getElementById("cloudSaveMessage");if(el)el.textContent=text;const suffix=document.getElementById("cloudSaveGuestSuffix");if(suffix)suffix.style.display=currentPlayer?"none":"inline";}
function setLeaderboardStatus(text){const el=document.getElementById("leaderboardMessage");if(el)el.textContent=text;}
async function submitLevelScore(){
 if(scoreSubmittedForRun)return;
 if(!currentPlayer){setLeaderboardStatus("Sign in and pass a level to join the rankings.");return;}
 scoreSubmittedForRun=true;
 setLeaderboardStatus("Submitting your level score…");
 try{
  const {error}=await supabase.rpc("record_game_score",{p_game_id:"fruit-fancy",p_level:level+1,p_score:score});
  if(error)throw error;
  setLeaderboardStatus("✓ Level score submitted. Check your ranking above.");
 }catch(error){
  console.error("Fruit Fancy leaderboard submission failed:",error);
  scoreSubmittedForRun=false;
  setLeaderboardStatus("Score submission failed. It will retry after your next completed run.");
 }
}
function gameSnapshot(){return {version:1,level,score,target,moves,sound,timeLeft:Math.max(0,Math.ceil((levelDeadline-Date.now())/1000)),savedAt:Date.now(),board:board.map(row=>row.map(cell=>({fruit:cell.fruit.type,ice:!!cell.ice,bomb:!!cell.bomb})))};}
async function saveGame(){
 if(!currentPlayer||!board.length)return;
 const userId=currentPlayer.id,saveData=gameSnapshot();
 saveChain=saveChain.catch(()=>{}).then(async()=>{
  if(!currentPlayer||currentPlayer.id!==userId)return;
  const {error}=await supabase.from("game_saves").upsert({user_id:userId,game_id:"fruit-fancy",save_data:saveData,updated_at:new Date().toISOString()},{onConflict:"user_id,game_id"});
  if(error)throw error;
 });
 try{await saveChain;if(currentPlayer&&currentPlayer.id===userId)setCloudStatus("✓ Cloud save synced · "+new Date().toLocaleTimeString());}
 catch(error){console.error("Fruit Fancy cloud save failed:",error);setCloudStatus("Cloud save unavailable · your current game is still playable.");}
}
function restoreGame(data){
 if(!data||data.version!==1||!Number.isInteger(data.level)||data.level<0||data.level>=LEVELS.length||!Array.isArray(data.board)||data.board.length!==N||!data.board.every(row=>Array.isArray(row)&&row.length===N))return false;
 const cfg=LEVELS[data.level],fruitByType=Object.fromEntries(FRUITS.map(f=>[f.type,f]));
 if(!data.board.every(row=>row.every(cell=>cell&&fruitByType[cell.fruit])))return false;
 level=data.level;target=cfg.target;score=Number.isFinite(data.score)&&data.score>=0?data.score:0;moves=Number.isInteger(data.moves)&&data.moves>=0?Math.min(data.moves,cfg.moves):cfg.moves;sound=typeof data.sound==="boolean"?data.sound:true;
 const savedSeconds=Number.isFinite(data.timeLeft)?Math.max(0,Math.min(LEVEL_DURATION,data.timeLeft)):LEVEL_DURATION;const elapsed=Number.isFinite(data.savedAt)?Math.max(0,(Date.now()-data.savedAt)/1000):0;timeLeft=Math.max(0,Math.ceil(savedSeconds-elapsed));
 board=data.board.map(row=>row.map(cell=>({fruit:fruitByType[cell.fruit],ice:!!cell.ice,bomb:!!cell.bomb})));path=[];busy=false;dragging=false;render();const reshuffled=ensurePlayableBoard();update();
 $("soundBtn").innerHTML=sound?'<i class="fas fa-volume-up"></i>':'<i class="fas fa-volume-mute text-red-300"></i>';
 $("modalOverlay").classList.remove("show");
 if(score>=target)show("🏆","LEVEL PASSED!","Level cleared! Your score has been recorded for this level.","Next Level");else if(timeLeft<=0)show("⏰","TIME UP!","Your two minutes are over. Try the level again!","Try Again");else if(moves<=0)show("💔","OUT OF MOVES!","Don’t give up, try blending again!","Try Again");else startTimer();
 if(reshuffled)saveGame();
 return true;
}
async function loadSavedGame(user){
 if(!user||!currentPlayer||currentPlayer.id!==user.id)return;
 setCloudStatus("Loading your cloud save…");
 const {data,error}=await supabase.from("game_saves").select("save_data,updated_at").eq("user_id",user.id).eq("game_id","fruit-fancy").maybeSingle();
 if(!currentPlayer||currentPlayer.id!==user.id)return;
 if(error){console.error("Fruit Fancy cloud load failed:",error);setCloudStatus("Cloud save could not load · playing on this device.");return;}
 if(data&&restoreGame(data.save_data))setCloudStatus("✓ Progress restored from cloud · "+new Date(data.updated_at).toLocaleString());
 else setCloudStatus("Signed in · your Fruit Fancy progress will save automatically.");
}
async function refreshPlayerSession(){
 const {data,error}=await supabase.auth.getSession();if(error){console.error(error);return;}
 const next=data.session?.user||null;
 if(next?.id!==currentPlayer?.id){currentPlayer=next;if(next){setLeaderboardStatus("Pass a level to submit your score.");await loadSavedGame(next);}else{setLeaderboardStatus("Sign in and pass a level to join the rankings.");setCloudStatus("Guest play · sign in to sync progress across devices");}}
 else if(next){setCloudStatus("✓ Cloud saves enabled · signed in");setLeaderboardStatus("Pass a level to submit your score.");}
}
const $=id=>document.getElementById(id),grid=$('grid'),line=$('lineCanvas'),fx=$('fxCanvas'),lc=line.getContext('2d'),fc=fx.getContext('2d');
function fruit(){return FRUITS[Math.floor(Math.random()*FRUITS.length)]}
function audioInit(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function tone(type,p=1){if(!sound)return;try{audioInit();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.connect(g);g.connect(audio.destination);o.type=type==='blast'?'sawtooth':type==='bomb'?'square':'triangle';let start=type==='bomb'?120:type==='blast'?150:380;o.frequency.setValueAtTime(start,t);o.frequency.exponentialRampToValueAtTime(type==='bomb'?30:type==='blast'?600:Math.max(650,500*p),t+(type==='blast'?.4:.18));g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}}
function resize(){let r=$('boardContainer').getBoundingClientRect();[line,fx].forEach(c=>{c.width=Math.round(r.width*devicePixelRatio);c.height=Math.round(r.height*devicePixelRatio);c.style.width=r.width+'px';c.style.height=r.height+'px';c.getContext('2d').setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)})}
function start(i=level,shouldSave=true){stopTimer();level=(i+LEVELS.length)%LEVELS.length;let cfg=LEVELS[level];score=0;target=cfg.target;moves=cfg.moves;timeLeft=LEVEL_DURATION;path=[];busy=false;dragging=false;scoreSubmittedForRun=false;makeBoard(cfg.ice,cfg.bombs);ensurePlayableBoard();$('modalOverlay').classList.remove('show');update();startTimer();if(shouldSave)saveGame()}
function makeBoard(ice,bombs){board=Array.from({length:N},(_,r)=>Array.from({length:N},(_,c)=>({fruit:fruit(),ice:false,bomb:false})));let place=(key,count)=>{let n=0;while(n<count){let r=Math.random()*N|0,c=Math.random()*N|0;if(!board[r][c][key]&&!(key==='bomb'&&board[r][c].ice)){board[r][c][key]=true;n++}}};place('ice',ice);place('bomb',bombs);render()}
function render(){grid.innerHTML='';board.forEach((row,r)=>row.forEach((cell,c)=>{let el=document.createElement('div');el.className='tile';el.dataset.r=r;el.dataset.c=c;let icon=document.createElement('span');icon.className='fruit-icon';icon.textContent=cell.bomb?'💣':cell.fruit.emoji;el.append(icon);if(cell.ice){let ice=document.createElement('div');ice.className='ice-layer';ice.innerHTML='<i class="fas fa-snowflake animate-pulse"></i>';el.append(ice)}grid.append(el)}))}
function update(){$('levelText').textContent=level+1;$('scoreText').textContent=score.toLocaleString();$('targetText').textContent=target.toLocaleString();$('movesText').textContent=moves;$('progressBar').style.width=Math.min(100,score/target*100)+'%';const t=$('timeText');if(t){const seconds=Math.max(0,timeLeft);t.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');t.classList.toggle('urgent',seconds<=20)}}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}levelDeadline=Date.now()+Math.max(0,timeLeft)*1000}
function startTimer(){stopTimer();levelDeadline=Date.now()+Math.max(0,timeLeft)*1000;update();timerId=setInterval(()=>{timeLeft=Math.max(0,Math.ceil((levelDeadline-Date.now())/1000));update();if(timeLeft<=0){stopTimer();if(!busy)endCheck();}},250)}
function hasAvailableMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const first=board[r][c];if(first.ice||first.bomb)continue;const type=first.fruit.type,used=new Set([r*N+c]);const extend=(rr,cc)=>{if(used.size>=3)return true;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=rr+dr,nc=cc+dc,k=nr*N+nc;if(nr<0||nr>=N||nc<0||nc>=N||used.has(k))continue;const cell=board[nr][nc];if(cell.ice||(!cell.bomb&&cell.fruit.type!==type))continue;used.add(k);if(extend(nr,nc))return true;used.delete(k)}return false};if(extend(r,c))return true}return false}
function findPlayableTriple(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(board[r][c].ice||board[r][c].bomb)continue;const chain=[{r,c}],walk=()=>{if(chain.length===3)return true;const last=chain[chain.length-1];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=last.r+dr,nc=last.c+dc;if(nr<0||nr>=N||nc<0||nc>=N||board[nr][nc].ice||chain.some(p=>p.r===nr&&p.c===nc))continue;chain.push({r:nr,c:nc});if(walk())return true;chain.pop()}return false};if(walk())return chain.slice()}return []}
function shuffleFruits(force=false){if(!force&&hasAvailableMove())return false;const cells=board.flat().filter(cell=>!cell.ice);for(let attempt=0;attempt<300;attempt++){const fruits=cells.map(cell=>cell.fruit);for(let i=fruits.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[fruits[i],fruits[j]]=[fruits[j],fruits[i]]}cells.forEach((cell,i)=>cell.fruit=fruits[i]);if(hasAvailableMove()){path=[];render();combo(force?'FRUITS REFRESHED! 🔄':'NO MOVES · AUTOMATIC SHUFFLE! 🔄');return true}}const triple=findPlayableTriple();if(triple.length===3){const chosen=fruit();triple.forEach(p=>board[p.r][p.c].fruit=chosen)}path=[];render();if(!hasAvailableMove())console.error('Fruit Fancy could not create a playable board.');else combo(force?'FRUITS REFRESHED! 🔄':'BOARD SHUFFLED! 🔄');return true}
function ensurePlayableBoard(){return shuffleFruits(false)}
function refreshBoard(){if(busy||dragging||moves<=0||timeLeft<=0||$('modalOverlay').classList.contains('show'))return;lc.clearRect(0,0,line.width,line.height);if(shuffleFruits(true)){update();saveGame()}}
function scanBoardAutomatically(){if(!initialized||busy||dragging||moves<=0||timeLeft<=0||$('modalOverlay').classList.contains('show'))return false;if(hasAvailableMove())return false;const shuffled=ensurePlayableBoard();if(shuffled){update();saveGame()}return shuffled}
 function startBoardScanner(){if(boardScanTimer)clearInterval(boardScanTimer);boardScanTimer=setInterval(scanBoardAutomatically,350);scanBoardAutomatically()}
 function tileAt(x,y){let el=document.elementFromPoint(x,y)?.closest('.tile');return el?{r:+el.dataset.r,c:+el.dataset.c}:null}
function same(a,b){return a.r===b.r&&a.c===b.c}
function highlight(){grid.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));path.forEach(p=>grid.querySelector('[data-r="'+p.r+'"][data-c="'+p.c+'"]')?.classList.add('selected'));drawLine()}
function drawLine(){lc.clearRect(0,0,line.width,line.height);if(path.length<2)return;let root=$('boardContainer').getBoundingClientRect(),first=board[path[0].r][path[0].c];lc.beginPath();lc.lineWidth=7;lc.lineCap='round';lc.lineJoin='round';lc.strokeStyle=first.fruit.color;lc.shadowColor=first.fruit.color;lc.shadowBlur=12;path.forEach((p,i)=>{let r=grid.querySelector('[data-r="'+p.r+'"][data-c="'+p.c+'"]').getBoundingClientRect(),x=r.left+r.width/2-root.left,y=r.top+r.height/2-root.top;i?lc.lineTo(x,y):lc.moveTo(x,y)});lc.stroke()}
function down(e){if(busy||moves<=0)return;if(!hasAvailableMove()){if(ensurePlayableBoard())saveGame();return}let p=tileAt(e.clientX,e.clientY);if(!p||board[p.r][p.c].ice)return;try{grid.setPointerCapture(e.pointerId)}catch(_){}audioInit();dragging=true;path=[p];highlight();tone('select',1)}
function move(e){if(!dragging)return;let p=tileAt(e.clientX,e.clientY);if(!p)return;let last=path[path.length-1];if(path.length>1&&same(p,path[path.length-2])){path.pop();highlight();return}if(path.some(q=>same(q,p)))return;let dr=Math.abs(p.r-last.r),dc=Math.abs(p.c-last.c);if(dr>1||dc>1||(!dr&&!dc))return;let first=board[path[0].r][path[0].c],cell=board[p.r][p.c];if(cell.ice||(!cell.bomb&&cell.fruit.type!==first.fruit.type))return;path.push(p);highlight();tone('select',path.length)}
function up(){if(!dragging)return;dragging=false;lc.clearRect(0,0,line.width,line.height);if(path.length>=3)process();else{path=[];highlight()}}
function popup(x,y,txt){let e=document.createElement('div');e.className='floating-score';e.style.left=x+'px';e.style.top=y+'px';e.textContent=txt;$('boardContainer').append(e);setTimeout(()=>e.remove(),850)}
function burst(x,y,color){for(let i=0;i<9;i++){let a=Math.random()*Math.PI*2,s=1.5+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1,r:2+Math.random()*3})}}
function combo(txt){let e=document.createElement('div');e.className='combo-popup text-3xl sm:text-4xl font-black text-yellow-300 drop-shadow-lg';e.textContent=txt;$('comboContainer').append(e);setTimeout(()=>e.remove(),1200)}
async function process(){busy=true;moves--;let length=path.length,blast=length>=7,points=length*10+(blast?100:0);score+=points;tone(blast?'blast':'pop',1);if(blast)combo('JUICY BLENDER BLAST! 🍹');else if(length>=5)combo('FRUITTASTIC! 🌟');let root=$('boardContainer').getBoundingClientRect(),remove=new Set(path.map(p=>p.r+','+p.c));path.forEach(p=>{let cell=board[p.r][p.c],el=grid.querySelector('[data-r="'+p.r+'"][data-c="'+p.c+'"]'),r=el.getBoundingClientRect(),x=r.left+r.width/2-root.left,y=r.top+r.height/2-root.top;popup(x,y,'+'+Math.round(points/length));burst(x,y,cell.fruit.color);if(cell.bomb){tone('bomb');for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=p.r+dr,cc=p.c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)remove.add(rr+','+cc)}}[[p.r-1,p.c],[p.r+1,p.c],[p.r,p.c-1],[p.r,p.c+1]].forEach(([r,c])=>{if(r>=0&&r<N&&c>=0&&c<N&&board[r][c].ice)board[r][c].ice=false})});grid.querySelectorAll('.tile').forEach(t=>t.classList.remove('selected'));path=[];update();await new Promise(r=>setTimeout(r,280));gravity(remove);await new Promise(r=>setTimeout(r,180));busy=false;if(score<target&&moves>0&&timeLeft>0)ensurePlayableBoard();update();endCheck();saveGame()}
function gravity(remove){remove.forEach(s=>{let [r,c]=s.split(',').map(Number);board[r][c]=null});for(let c=0;c<N;c++){let dest=N-1;for(let r=N-1;r>=0;r--)if(board[r][c]){board[dest][c]=board[r][c];if(dest!==r)board[r][c]=null;dest--}for(let r=dest;r>=0;r--)board[r][c]={fruit:fruit(),ice:false,bomb:Math.random()<.08}}render()}
function endCheck(){if(score>=target){tone('win');submitLevelScore();show('🏆','LEVEL PASSED!','Level cleared! Your score has been recorded for this level.','Next Level')}else if(timeLeft<=0){tone('fail');show('⏰','TIME UP!','Two minutes are over. Your run score was not added to the leaderboard.','Try Again')}else if(moves<=0){tone('fail');show('💔','OUT OF MOVES!','Your run score was not added to the leaderboard. Try again!','Try Again')}}
function show(icon,title,desc,btn){stopTimer();$('modalIcon').textContent=icon;$('modalTitle').textContent=title;$('modalDesc').textContent=desc;$('modalFinalScore').textContent=score.toLocaleString();$('modalMovesLeft').textContent=moves;$('modalActionBtn').textContent=btn;$('modalOverlay').classList.add('show')}
grid.addEventListener('pointerdown',down);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').innerHTML=sound?'<i class="fas fa-volume-up"></i>':'<i class="fas fa-volume-mute text-red-300"></i>'});
$('refreshBtn').addEventListener('click',refreshBoard);$('modalActionBtn').addEventListener('click',()=>score>=target?start(level+1):start(level));
function particlesLoop(){fc.clearRect(0,0,fx.width,fx.height);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.035;fc.globalAlpha=Math.max(0,p.life);fc.fillStyle=p.color;fc.beginPath();fc.arc(p.x,p.y,p.r,0,Math.PI*2);fc.fill()});fc.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(particlesLoop)}
async function initializeGame(){resize();start(0,false);particlesLoop();initialized=true;startBoardScanner();await refreshPlayerSession();if(!busy&&!dragging&&moves>0&&timeLeft>0)scanBoardAutomatically();}
supabase.auth.onAuthStateChange((event)=>{if(["SIGNED_IN","SIGNED_OUT","TOKEN_REFRESHED","USER_UPDATED"].includes(event))setTimeout(()=>refreshPlayerSession(),0)});
window.addEventListener("pageshow",()=>{if(initialized)refreshPlayerSession()});
window.addEventListener('resize',resize);window.addEventListener('load',initializeGame);
</script>
