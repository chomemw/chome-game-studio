<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Access | CHOME</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#0b1020;color:#f4f6ff;font-family:Arial,sans-serif}.panel{width:min(100%,540px);padding:32px;border:1px solid #ffffff22;border-radius:22px;background:#111a2b}h1{font-size:30px}p{color:#b8c4d8;line-height:1.65}.detail{padding:14px;margin-top:12px;border:1px solid #ffffff18;border-radius:12px}.detail b{display:block;margin-bottom:8px}.btn{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#b9a5ff;font-weight:bold}</style></head><body><main class="panel"><b>CHOME GAME STUDIO</b><h1 id="heading">Checking account access</h1><p id="intro">Please wait while we retrieve your account status.</p><div class="detail"><b>REASON</b><p id="reason">Checking…</p></div><div class="detail"><b>WHAT YOU NEED TO DO</b><p id="steps">Checking…</p></div><button class="btn" id="signOut">SIGN OUT</button></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://zbumbbzvrjqjgroxzixg.supabase.co','sb_publishable_dCXdE2oXUIl_UCbvhJcJ4Q_vDIY5eCK');const $=id=>document.getElementById(id);const {data:{session}}=await supabase.auth.getSession();if(!session?.user){$('heading').textContent='Sign-in required';$('intro').textContent='Please sign in to check your account access.';$('reason').textContent='No active session.';$('steps').textContent='Return to the CHOME sign-in page.';$('signOut').textContent='GO TO SIGN IN';}else{const {data,error}=await supabase.rpc('get_my_account_access');if(error){$('heading').textContent='Access check unavailable';$('intro').textContent='CHOME could not verify your account status. Access remains blocked until the check succeeds.';$('reason').textContent='The account status service did not respond.';$('steps').textContent='Try again later or contact CHOME support.';}else if(data?.status==='restricted'){$('heading').textContent='Account temporarily restricted';$('intro').textContent='Your CHOME account has been restricted by the studio administration team. Game sessions and reward credits are disabled while this restriction is active.';$('reason').textContent=data.reason||'No reason was provided.';$('steps').textContent=data.resolution_steps||'Please contact CHOME support for instructions.';}else{location.replace('dashboard.html');}}$('signOut').addEventListener('click',async()=>{const{error}=await supabase.auth.signOut();if(error){$('intro').textContent='Could not sign out: '+error.message;return;}location.replace('player.html');});</script></body></html>
