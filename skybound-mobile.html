<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Fruit Slicer Arcade | CHOME Game Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px 12px;background:#090d18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start}
#game-container{text-align:center;background:#1a1a2e;color:#fff;padding:20px;border-radius:12px;width:min(600px,100%);margin:0 auto}
#game-container h2{margin-top:0;color:#ff6b6b}
.scorebar{display:flex;justify-content:space-around;margin-bottom:10px;font-size:18px;font-weight:bold}
#score{color:#4cd137}#lives{color:#e84118}
.canvas-wrap{position:relative;display:block;width:100%;max-width:500px;margin:0 auto}
#fruitCanvas{display:block;width:100%;height:auto;aspect-ratio:5/4;background:linear-gradient(to bottom,#0f0c29,#302b63,#24243e);border-radius:8px;cursor:crosshair;touch-action:none;box-shadow:0 8px 16px rgba(0,0,0,.5)}
.overlay{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px}
#start-screen{background:rgba(0,0,0,.85)}
#game-over-screen{background:rgba(0,0,0,.9);display:none}
.overlay h1{margin:0 0 10px}
#start-screen h1{color:#ff9ff3}
#game-over-screen h1{color:#e84118;margin-bottom:5px}
.overlay p{color:#dcdde1;margin:0 0 20px;font-size:14px;max-width:360px}
#game-over-screen p{font-size:20px;margin-bottom:15px}
#final-score{color:#4cd137;font-weight:bold}
.game-btn{color:white;border:0;padding:12px 30px;font-size:18px;font-weight:bold;border-radius:25px;cursor:pointer}
#start-btn{background:#4cd137;box-shadow:0 4px 15px rgba(76,209,55,.4)}
#restart-btn{background:#ff6b6b}
@media(max-width:420px){body{padding:10px 8px}#game-container{padding:12px 8px}.scorebar{font-size:16px}.overlay h1{font-size:25px}.overlay p{font-size:12px}}
</style>
</head>
<body>
<div id="game-container">
  <h2>🍉 Fruit Slicer Arcade 🍎</h2>
  <div class="scorebar">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">❤️❤️❤️</span></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="fruitCanvas" width="500" height="400"></canvas>
    <div id="start-screen" class="overlay">
      <h1>Ready to Slice?</h1>
      <p>Drag your mouse or finger rapidly across the fruits to slice them. Avoid the black bombs!</p>
      <button id="start-btn" class="game-btn">START GAME</button>
    </div>
    <div id="game-over-screen" class="overlay">
      <h1>Game Over!</h1>
      <p>Final Score: <span id="final-score">0</span></p>
      <button id="restart-btn" class="game-btn">PLAY AGAIN</button>
    </div>
  </div>
  <p style="color:#aab3c7;font-size:12px;margin:12px 0 0">Swipe across fruit to score points. Don't let fruit fall!</p>
</div>
<script>
(function() {
  const canvas = document.getElementById('fruitCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const startScreen = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const finalScoreEl = document.getElementById('final-score');

  let score = 0;
  let lives = 3;
  let gameRunning = false;
  let fruits = [];
  let particles = [];
  let bladeTrail = [];
  let spawnTimer = 0;

  const fruitTypes = [
    { name: '🍉', color: '#ff4757', radius: 30 },
    { name: '🍎', color: '#ff6b81', radius: 26 },
    { name: '🍊', color: '#ffa502', radius: 25 },
    { name: '🍌', color: '#eccc68', radius: 28 },
    { name: '🥝', color: '#7bed9f', radius: 22 },
    { name: '💣', color: '#2f3640', radius: 25, isBomb: true }
  ];

  function startGame() {
    score = 0;
    lives = 3;
    fruits = [];
    particles = [];
    bladeTrail = [];
    spawnTimer = 0;
    scoreEl.textContent = score;
    updateLivesDisplay();
    startScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    gameRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    gameRunning = false;
    finalScoreEl.textContent = score;
    gameOverScreen.style.display = 'flex';
  }

  function updateLivesDisplay() {
    livesEl.textContent = '❤️'.repeat(Math.max(0, lives));
  }

  let isDragging = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  canvas.addEventListener('mousedown', (e) => {
    if (!gameRunning) return;
    isDragging = true;
    bladeTrail = [getPos(e)];
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!isDragging || !gameRunning) return;
    const pos = getPos(e);
    bladeTrail.push(pos);
    if (bladeTrail.length > 8) bladeTrail.shift();
    checkSlice(pos);
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    bladeTrail = [];
  });

  canvas.addEventListener('touchstart', (e) => {
    if (!gameRunning) return;
    isDragging = true;
    bladeTrail = [getPos(e)];
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (!isDragging || !gameRunning) return;
    const pos = getPos(e);
    bladeTrail.push(pos);
    if (bladeTrail.length > 8) bladeTrail.shift();
    checkSlice(pos);
    e.preventDefault();
  }, { passive: false });

  window.addEventListener('touchend', () => {
    isDragging = false;
    bladeTrail = [];
  });

  function checkSlice(pos) {
    fruits.forEach(f => {
      if (!f.sliced) {
        const dist = Math.hypot(f.x - pos.x, f.y - pos.y);
        if (dist < f.radius + 10) {
          f.sliced = true;
          if (f.isBomb) {
            lives = 0;
            updateLivesDisplay();
            gameOver();
          } else {
            score += 10;
            scoreEl.textContent = score;
            createSplash(f.x, f.y, f.color);
          }
        }
      }
    });
  }

  function createSplash(x, y, color) {
    for (let i = 0; i < 15; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        radius: Math.random() * 4 + 2,
        color: color,
        alpha: 1
      });
    }
  }

  function spawnFruit() {
    const type = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
    const x = Math.random() * (canvas.width - 100) + 50;
    const y = canvas.height + 30;
    const vx = (canvas.width / 2 - x) * 0.015 + (Math.random() - 0.5) * 3;
    const vy = -(Math.random() * 4 + 11);

    fruits.push({
      x: x,
      y: y,
      vx: vx,
      vy: vy,
      radius: type.radius,
      name: type.name,
      color: type.color,
      isBomb: type.isBomb || false,
      sliced: false,
      rotation: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.1
    });
  }

  let lastTime = 0;
  function gameLoop(time) {
    if (!gameRunning) return;

    const dt = (time - lastTime) / 1000;
    lastTime = time;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    spawnTimer += dt;
    if (spawnTimer > 1.1) {
      spawnFruit();
      if (Math.random() > 0.5) spawnFruit();
      spawnTimer = 0;
    }

    for (let i = fruits.length - 1; i >= 0; i--) {
      let f = fruits[i];
      f.vy += 0.35;
      f.x += f.vx;
      f.y += f.vy;
      f.rotation += f.vRot;

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.font = (f.radius * 1.6) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.name, 0, 0);
      ctx.restore();

      if (!f.sliced && f.y > canvas.height + 50) {
        if (!f.isBomb) {
          lives--;
          updateLivesDisplay();
          if (lives <= 0) {
            gameOver();
            return;
          }
        }
        fruits.splice(i, 1);
      } else if (f.sliced && f.y > canvas.height + 50) {
        fruits.splice(i, 1);
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.alpha -= 0.02;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
      } else {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    if (bladeTrail.length > 1) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
      for (let i = 1; i < bladeTrail.length; i++) {
        ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
      }
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    }

    requestAnimationFrame(gameLoop);
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
